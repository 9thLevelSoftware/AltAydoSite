name: FleetYards Ship Sync

on:
  workflow_dispatch:
  schedule:
    # Every 3 days at 07:17 UTC. GitHub scheduled workflows run on the
    # default branch and use UTC cron syntax.
    - cron: '17 7 */3 * *'

jobs:
  ship-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger ship database sync
        env:
          APP_URL: ${{ secrets.NEXTAUTH_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${CRON_SECRET}" ]; then
            echo "CRON_SECRET GitHub secret is not configured."
            exit 1
          fi

          APP_URL="${APP_URL:-https://aydocorp.space}"
          APP_URL="${APP_URL%/}"

          echo "Triggering FleetYards ship sync at ${APP_URL}..."
          sync_body="$(mktemp)"
          sync_status="000"
          if sync_status="$(curl --silent --show-error \
            --output "${sync_body}" \
            --write-out "%{http_code}" \
            --request POST \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/cron/ship-sync")"; then
            cat "${sync_body}"
            if [ "${sync_status}" -lt 200 ] || [ "${sync_status}" -ge 300 ]; then
              echo "Ship sync returned HTTP ${sync_status}."
              rm -f "${sync_body}"
              exit 1
            fi
          else
            sync_exit=$?
            cat "${sync_body}" || true
            rm -f "${sync_body}"
            echo "Ship sync request failed with curl exit ${sync_exit}."
            exit "${sync_exit}"
          fi
          rm -f "${sync_body}"

      - name: Warm mirrored ship images
        env:
          APP_URL: ${{ secrets.NEXTAUTH_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          APP_URL="${APP_URL:-https://aydocorp.space}"
          APP_URL="${APP_URL%/}"

          echo "Warming mirrored ship images at ${APP_URL}..."
          warm_body="$(mktemp)"
          warm_status="000"
          if warm_status="$(curl --silent --show-error \
            --output "${warm_body}" \
            --write-out "%{http_code}" \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/cron/warm-images")"; then
            cat "${warm_body}"
            if [ "${warm_status}" -lt 200 ] || [ "${warm_status}" -ge 300 ]; then
              echo "::warning::Image warm-up returned HTTP ${warm_status}; ship sync already completed."
            fi
          else
            warm_exit=$?
            cat "${warm_body}" || true
            echo "::warning::Image warm-up request failed with curl exit ${warm_exit}; ship sync already completed."
          fi
          rm -f "${warm_body}"
