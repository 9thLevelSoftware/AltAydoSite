# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - AydoCorp

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Create .env.local
        run: |
          cat > .env.local << 'EOF'
          # MongoDB connection string (vCore)
          MONGODB_URI=${{ secrets.MONGODB_URI }}

          # Email Configuration
          EMAIL_HOST=${{ secrets.EMAIL_HOST }}
          EMAIL_PORT=${{ secrets.EMAIL_PORT }}
          EMAIL_SECURE=${{ secrets.EMAIL_SECURE }}
          EMAIL_USER=${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD=${{ secrets.EMAIL_PASSWORD }}

          # Microsoft Entra ID Configuration
          ENTRA_TENANT_ID=${{ secrets.ENTRA_TENANT_ID }}
          ENTRA_CLIENT_ID=${{ secrets.ENTRA_CLIENT_ID }}
          ENTRA_CLIENT_SECRET=${{ secrets.ENTRA_CLIENT_SECRET }}

          # NextAuth Configuration
          NEXTAUTH_URL=${{ secrets.NEXTAUTH_URL }}
          NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}
          EOF



      - name: Install deps and build
        run: |
          npm ci
          npm run build

      - name: Prepare deployment artifact
        run: |
          set -e
          mkdir -p deploy

          # Copy built Next.js application
          cp -R .next deploy/.next
          cp -R public deploy/public
          cp -R node_modules deploy/node_modules
          cp package.json deploy/package.json
          cp package-lock.json deploy/package-lock.json
          cp next.config.js deploy/next.config.js

          # Copy server.js if it exists (for standalone mode)
          if [ -f .next/standalone/server.js ]; then
            cp .next/standalone/server.js deploy/server.js
          fi

          # Avoid shipping unnecessary large folders
          find deploy -name "archive" -type d -prune -exec rm -rf {} + || true
          find deploy -name "Build Logs" -type d -prune -exec rm -rf {} + || true

          # Create zip
          (cd deploy && zip -qr ../release.zip .)

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Unzip artifact for deployment
        run: unzip -q release.zip

      - name: Create deployment timestamp marker
        run: |
          echo "BUILD_TIMESTAMP=$(date -u +%Y%m%d_%H%M%S)" >> deployment-info.txt
          echo "BUILD_ID=$(cat .next/BUILD_ID 2>/dev/null || echo 'unknown')" >> deployment-info.txt

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'AydoCorp'
          slot-name: 'Production'
          package: .
          clean: true
          restart: true
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_E8F83D01518942F1B2B01381F804622F }}

      - name: Trigger ship database sync
        env:
          APP_URL: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
          FALLBACK_APP_URL: ${{ secrets.NEXTAUTH_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${CRON_SECRET}" ]; then
            echo "CRON_SECRET GitHub secret is not configured; skipping post-deploy ship sync."
            exit 0
          fi

          if [ -z "${APP_URL}" ]; then
            APP_URL="${FALLBACK_APP_URL:-https://aydocorp.space}"
          fi

          APP_URL="${APP_URL%/}"
          echo "Waiting for deployed app to respond at ${APP_URL}..."
          for attempt in {1..20}; do
            if curl --silent --show-error --fail "${APP_URL}/api/ships/sync-status" > /dev/null; then
              break
            fi
            if [ "${attempt}" -eq 20 ]; then
              echo "App did not become ready before ship sync."
              exit 1
            fi
            sleep 6
          done

          read_sync_status() {
            python3 - "$1" <<'PY'
          import json
          import sys

          try:
              with open(sys.argv[1], encoding="utf-8") as handle:
                  data = json.load(handle)
          except Exception:
              print("0 unknown null")
              raise SystemExit(0)

          try:
              sync_version = int(data.get("syncVersion") or 0)
          except Exception:
              sync_version = 0

          status = data.get("status") or "unknown"
          last_sync_at = data.get("lastSyncAt") or "null"
          print(f"{sync_version} {status} {last_sync_at}")
          PY
          }

          # Post-deploy data refresh is best-effort: the Azure deploy has already
          # succeeded by this point, so failing here would not roll anything back.
          # Instead of silently warning, we accumulate problems and surface them in
          # the job summary so a partial/failed refresh is visible without marking a
          # successful production deploy as failed.
          refresh_issues=()
          add_issue() {
            refresh_issues+=("$1")
            echo "::warning::$1"
          }

          write_summary() {
            if [ -z "${GITHUB_STEP_SUMMARY:-}" ]; then
              return 0
            fi
            {
              echo "### Post-deploy data refresh"
              echo ""
              if [ "${#refresh_issues[@]}" -eq 0 ]; then
                echo "All post-deploy refresh steps (ship sync + image warm-up) completed successfully."
              else
                echo "The production deploy succeeded, but the post-deploy data refresh may not have completed. This step is best-effort and does not affect the already-running app; the next scheduled ship sync will retry."
                echo ""
                echo "Issues:"
                for issue in "${refresh_issues[@]}"; do
                  echo "- ${issue}"
                done
              fi
            } >> "${GITHUB_STEP_SUMMARY}"
          }
          trap write_summary EXIT

          # Require a readable baseline before polling. If we cannot read the
          # current sync version we must NOT assume 0, otherwise any stale published
          # status (version > 0) from a previous run would falsely look like this
          # deploy's sync completing. In that case we skip completion verification
          # and report it clearly instead of producing a false positive.
          baseline_body="$(mktemp)"
          baseline_version="0"
          baseline_ok="false"
          if curl --silent --show-error --fail \
            --output "${baseline_body}" \
            --header "Cache-Control: no-cache" \
            "${APP_URL}/api/ships/sync-status?baseline=$(date +%s%N)"; then
            baseline_line="$(read_sync_status "${baseline_body}")"
            baseline_version="${baseline_line%% *}"
            baseline_ok="true"
          else
            add_issue "Could not read baseline ship sync status; skipping sync completion verification to avoid a false positive."
          fi
          rm -f "${baseline_body}"

          echo "Triggering FleetYards ship sync..."
          sync_body="$(mktemp)"
          sync_status="000"
          sync_accepted="false"
          if sync_status="$(curl --silent --show-error \
            --max-time 30 \
            --output "${sync_body}" \
            --write-out "%{http_code}" \
            --request POST \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/cron/ship-sync?mode=async")"; then
            cat "${sync_body}"
            if [ "${sync_status}" -lt 200 ] || [ "${sync_status}" -ge 300 ]; then
              add_issue "Ship sync returned HTTP ${sync_status}; deploy already completed."
            else
              sync_accepted="true"
            fi
          else
            sync_exit=$?
            cat "${sync_body}" || true
            add_issue "Ship sync request failed with curl exit ${sync_exit}; deploy already completed."
          fi
          rm -f "${sync_body}"

          if [ "${sync_accepted}" = "true" ] && [ "${baseline_ok}" = "true" ]; then
            echo "Waiting for ship sync to publish a new status after version ${baseline_version}..."
            completed="false"
            for attempt in {1..30}; do
              poll_body="$(mktemp)"
              poll_status="000"
              if poll_status="$(curl --silent --show-error \
                --output "${poll_body}" \
                --write-out "%{http_code}" \
                --header "Cache-Control: no-cache" \
                "${APP_URL}/api/ships/sync-status?poll=$(date +%s%N)")"; then
                if [ "${poll_status}" -ge 200 ] && [ "${poll_status}" -lt 300 ]; then
                  status_line="$(read_sync_status "${poll_body}")"
                  sync_version="$(echo "${status_line}" | awk '{print $1}')"
                  ship_status="$(echo "${status_line}" | awk '{print $2}')"
                  last_sync_at="$(echo "${status_line}" | cut -d' ' -f3-)"
                  echo "Ship sync status attempt ${attempt}: version=${sync_version}, status=${ship_status}, lastSyncAt=${last_sync_at}"

                  if [ "${sync_version}" -gt "${baseline_version}" ]; then
                    rm -f "${poll_body}"
                    if [ "${ship_status}" = "failed" ]; then
                      add_issue "Ship sync completed with failed status; deploy already completed."
                    fi
                    completed="true"
                    break
                  fi
                else
                  echo "::warning::Sync status poll returned HTTP ${poll_status} (will retry)."
                fi
              else
                poll_exit=$?
                echo "::warning::Sync status poll failed with curl exit ${poll_exit} (will retry)."
              fi
              rm -f "${poll_body}"

              if [ "${attempt}" -lt 30 ]; then
                sleep 20
              fi
            done

            if [ "${completed}" != "true" ]; then
              add_issue "Ship sync did not publish a new status (> version ${baseline_version}) within the polling window; deploy already completed."
            fi
          elif [ "${sync_accepted}" = "true" ]; then
            add_issue "Ship sync was accepted but completion could not be verified because the baseline status was unreadable."
          fi

          echo "Warming mirrored ship images..."
          warm_body="$(mktemp)"
          warm_status="000"
          if warm_status="$(curl --silent --show-error \
            --output "${warm_body}" \
            --write-out "%{http_code}" \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/cron/warm-images")"; then
            cat "${warm_body}"
            if [ "${warm_status}" -lt 200 ] || [ "${warm_status}" -ge 300 ]; then
              add_issue "Image warm-up returned HTTP ${warm_status}; deploy and ship sync already completed."
            fi
          else
            warm_exit=$?
            cat "${warm_body}" || true
            add_issue "Image warm-up request failed with curl exit ${warm_exit}; deploy and ship sync already completed."
          fi
          rm -f "${warm_body}"
