# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - AydoTest

on:
  push:
    branches:
      - working_branch
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install deps and build
        run: |
          npm ci
          npm run build

      - name: Prepare deployment artifact
        run: |
          set -e
          mkdir -p deploy

          # Copy built Next.js application
          cp -R .next deploy/.next
          cp -R public deploy/public
          cp -R node_modules deploy/node_modules
          cp package.json deploy/package.json
          cp package-lock.json deploy/package-lock.json
          cp next.config.js deploy/next.config.js

          # Copy server.js if it exists (for standalone mode)
          if [ -f .next/standalone/server.js ]; then
            cp .next/standalone/server.js deploy/server.js
          fi

          # Avoid shipping unnecessary large folders
          find deploy -name "archive" -type d -prune -exec rm -rf {} + || true
          find deploy -name "Build Logs" -type d -prune -exec rm -rf {} + || true

          # Create zip
          (cd deploy && zip -qr ../release.zip .)

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Unzip artifact for deployment
        run: unzip -q release.zip

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_44421A86BD204DBD9CF89F0B84A9916E }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_B7D7CECFB5F3482C835D9EFB71A47375 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A8E9EB0DEC6145519050453D218AA101 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'AydoTest'
          slot-name: 'Production'
          package: .
